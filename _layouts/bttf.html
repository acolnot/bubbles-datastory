<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <link rel="icon" type="image/png" href="{{ '/assets/img/icon.png' | relative_url }}">
    <title>{{ site.title | default: site.github.repository_name }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/styles.css?v=' | append: site.github.build_revision | relative_url }}">
    <meta name="viewport" content="width=device-width">

    <style>
      body {
        background-color: #13184b;
        color: #13184b;
        font-family: 'Share Tech Mono', monospace, sans-serif;
      }

      .wrapper {
        max-width: 850px;
        margin: 40px auto;
        padding: 40px;
        background: #fdfbf7;
        border: 3px solid #2c3e50;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        border-radius: 8px;
      }

      h1, h2, h3, h4 {
        font-family: 'Orbitron', sans-serif;
        color: #b22222;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      hr {
        border: none;
        border-top: 2px dashed #b22222;
        margin: 30px 0;
      }

      a {
        background-color: #C05212;
        font-family: 'Share Tech Mono', monospace;
        text-decoration: none;
      }

      a:hover {
        color: #b22222;
        text-decoration: underline;
      }

      p {
        font-family: 'Share Tech Mono', monospace;
        color: #13184b
        }

    </style>
  </head>
  <body>
    <div class="wrapper">
      
      {{ content }}

    </div>

    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>

  {% if site.google_analytics %}
    <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
    </script>
  {% endif %}
  </body>
</html>
